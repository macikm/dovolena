<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdfa" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Sun in upper right -->
  <circle cx="370" cy="140" r="54" fill="url(#sunGrad)" opacity="0.95" filter="url(#shadow)" />

  <!-- Calendar card -->
  <g filter="url(#shadow)">
    <rect x="96" y="150" width="320" height="270" rx="36" fill="url(#cardGrad)" />
    <!-- Calendar header bar -->
    <path d="M 96 186 C 96 166.1 112.1 150 132 150 L 380 150 C 399.9 150 416 166.1 416 186 L 416 220 L 96 220 Z" fill="#0f766e" />
    
    <!-- Calendar rings -->
    <rect x="160" y="130" width="24" height="40" rx="12" fill="#e2e8f0" stroke="#0d9488" stroke-width="4" />
    <rect x="328" y="130" width="24" height="40" rx="12" fill="#e2e8f0" stroke="#0d9488" stroke-width="4" />

    <!-- Palm tree / holiday motif inside calendar -->
    <!-- Trunk -->
    <path d="M 235 380 C 238 340 248 300 270 265 C 273 268 266 315 258 380 Z" fill="#78350f" />
    <!-- Fronds -->
    <path d="M 270 265 C 240 250 200 260 180 280 C 205 275 235 272 270 265 Z" fill="#10b981" />
    <path d="M 270 265 C 260 235 235 220 205 225 C 225 238 250 250 270 265 Z" fill="#059669" />
    <path d="M 270 265 C 285 230 315 225 340 235 C 320 245 300 255 270 265 Z" fill="#10b981" />
    <path d="M 270 265 C 305 250 335 265 350 290 C 330 280 300 275 270 265 Z" fill="#059669" />

    <!-- Sparkles / calculate dots -->
    <circle cx="150" cy="340" r="10" fill="#0d9488" />
    <circle cx="190" cy="340" r="10" fill="#0d9488" />
    <circle cx="150" cy="375" r="10" fill="#0d9488" />
    <circle cx="190" cy="375" r="10" fill="#0d9488" />
  </g>
</svg>
